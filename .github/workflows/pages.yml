# Builds and deploys the Jekyll site to GitHub Pages.
#
# NOTE: this workflow will not successfully deploy until, in this repo's
# Settings -> Pages, the "Build and deployment" source is set to "GitHub
# Actions". That setting (and Pages hosting generally) also requires the
# repo to be public, unless the account is on GitHub Pro/Team/Enterprise.
# Until then, runs of this workflow are expected to fail at the deploy step
# -- that's expected, not a bug to chase.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
