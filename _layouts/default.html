<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">Corpomancy</a>
    <span class="site-tagline">field notes on Corporate Thaumaturgy</span>
  </header>
  <main{% if page.wide %} class="wide"{% endif %}>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Corpomancy is kept by the Working Group — <a href="https://github.com/gothosvc/corpomancy">submit a finding on GitHub</a>.</p>
  </footer>
</body>
</html>
